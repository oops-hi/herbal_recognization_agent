<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识图谱 · 多模态中草药识别智能体</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>🌿 知识图谱可视化</h1>
    <span class="tagline">交互式力导向图谱 · 离线可用（本地渲染，0 外部请求）</span>
    <div class="header-right">
      <a href="/" class="badge" style="text-decoration:none;">← 返回主页</a>
    </div>
  </header>

  <div class="graph-wrap">
    <div id="graph-area">
      <!-- 交互式 SVG 默认显示（避免 v1 静态图闪现）；graph.js 渲染后隐藏 loading -->
      <svg id="graph-svg"></svg>
      <div class="graph-loading" id="graph-loading">图谱加载中…</div>
      <!-- 静态 PNG 默认隐藏，仅 /api/graph 失败（断网/后端挂）时降级显示 -->
      <img id="graph-static" src="{{ url_for('static', filename='kg_graph.png') }}" alt="知识图谱">
      <div class="graph-tooltip" id="graph-tooltip" hidden></div>
      <div class="fallback-note" id="graph-fallback" hidden>
        交互式图谱加载失败（服务未运行或已断网），已自动降级为静态渲染图；档案检索随本地服务状态而定。
      </div>
    </div>

    <div class="legend-box">
      <span class="legend-chip" data-filter="herb" title="点击显隐"><span class="dot" style="background:#4caf50;"></span>带档案药材</span>
      <span class="legend-chip" data-filter="herb_minor" title="点击显隐"><span class="dot" style="background:#bdbdbd;"></span>次要节点</span>
      <span class="legend-chip" data-filter="formula" title="点击显隐"><span class="sq" style="background:#42a5f5;"></span>经典方剂</span>
      <span class="legend-chip" data-filter="禁忌" title="点击显隐"><span class="line"></span>配伍禁忌（十八反 / 十九畏）</span>
      <span class="legend-chip" data-filter="组成" title="点击显隐"><span class="line" style="border-color:#b9b2a3;"></span>方剂组成</span>
      <span id="graph-stats" style="color:var(--gray);"></span>
      <button id="reheat-btn" title="重新布局并复位视图">↻ 重新布局</button>
    </div>

    <div class="search-box">
      <div class="row">
        <input id="herb-input" placeholder="离线检索药材档案，如：枸杞子 / 栝楼皮（别名）/ 瓜蒌皮" list="herb-suggest">
        <datalist id="herb-suggest">
          <option>枸杞子</option><option>菊花</option><option>瓜蒌皮</option><option>川乌</option>
          <option>山楂</option><option>连翘</option><option>栀子</option><option>砂仁</option>
          <option>豆蔻</option><option>草豆蔻</option><option>甘草</option><option>桃仁</option>
          <option>苦杏仁</option><option>金樱子</option><option>补骨脂</option>
        </datalist>
        <button id="herb-btn">查询</button>
      </div>
      <div class="search-result" id="herb-result"></div>
    </div>
  </div>

  <footer class="disclaimer">
    <b>免责声明：</b>本工具仅供学习与科普参考，不构成医疗、诊断或用药建议；
    图谱内容依据《中国药典》2020 年版一部与教材方剂整理，数据仍在人工核对中；
    有毒药材信息请勿自行采食；紧急情况请立即就医。
  </footer>

  <!-- 全部本地资源：vendor d3 + graph.js（零 CDN，断网可用） -->
  <script src="{{ url_for('static', filename='vendor/d3.v7.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/graph.js') }}"></script>
  <script>
    (function () {
      "use strict";
      // v1 的搜索框逻辑已并入 graph.js（GraphPage.showProfile），这里只绑事件
      const input = document.getElementById("herb-input");
      const btn = document.getElementById("herb-btn");
      if (!window.GraphPage) return; // 极端降级：graph.js 未加载，搜索框静默
      function query() { GraphPage.showProfile(input.value); }
      btn.addEventListener("click", query);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") query(); });
    })();
  </script>
</body>
</html>
